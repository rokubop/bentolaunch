<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>BentoLaunch</title>

  <!-- Four tiles on one 2x2 grid. Three resting, the fourth lit: same cell,
       same size, same rounding as its neighbours, so the colour is the whole
       difference. It used to sit outside the grid and larger, which read as a
       tile that had missed its slot rather than one that was chosen. -->

  <defs>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC24B"/>
      <stop offset="1" stop-color="#FF5F6D"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="#1A1A1E"/>

  <g fill="#3A4152">
    <rect x="44"  y="44"  width="76" height="76" rx="18"/>
    <rect x="136" y="44"  width="76" height="76" rx="18"/>
    <rect x="44"  y="136" width="76" height="76" rx="18"/>
  </g>

  <rect x="136" y="136" width="76" height="76" rx="18" fill="url(#lit)"/>
</svg>
