[package]
name = "flick"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "Hotkey-summoned grid of everything worth switching to: windows, browser tabs, taskbar pins, folders, apps, settings pages, links"
readme = "README.md"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
toml_edit = "0.25.13"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
windows = { version = "0.62.2", features = ["Foundation", "Foundation_Numerics", "UI", "UI_Composition", "UI_Composition_Desktop", "System", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_Security_Cryptography", "Win32_UI_Controls", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Graphics_DirectX"] }
# Only for `#[implement]`, whose expansion refers to `windows_core` by name.
windows-core = "0.62.2"
windows-numerics = "0.3.1"
